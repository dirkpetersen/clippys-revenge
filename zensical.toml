# User documentation for Clippy's Revenge. Build: zensical build --clean --strict
[project]
site_name = "Clippy's Revenge"
site_url = "https://dirkpetersen.github.io/clippys-revenge/"
site_description = "Your classic Outlook as a local MCP server for Claude Code. No cloud, no Graph, no OAuth."
repo_url = "https://github.com/dirkpetersen/clippys-revenge"
repo_name = "dirkpetersen/clippys-revenge"
docs_dir = "manual"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "install.md",
    "connect.md",
    "updates.md",
  ] },
  { "Use" = [
    "tools.md",
    "tray.md",
    "indexing.md",
    "calendar.md",
    "ai-drafts.md",
  ] },
  { "Reference" = [
    "security.md",
    "troubleshooting.md",
    "faq.md",
    "changelog.md",
  ] },
]

[project.theme]
language = "en"
favicon = "assets/logo.svg"
logo = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
