<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-labelledby="t d">
  <title id="t">Clippy's Revenge</title>
  <desc id="d">A determined paperclip with big eyes wrestling an envelope into a headlock.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="0.45" stop-color="#9aa6b2"/>
      <stop offset="0.7" stop-color="#d7dee5"/>
      <stop offset="1" stop-color="#6b7785"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b2545" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- dust cloud -->
  <g fill="#c9d6e3" opacity="0.55">
    <circle cx="110" cy="300" r="22"/><circle cx="145" cy="308" r="17"/><circle cx="300" cy="305" r="20"/>
    <circle cx="330" cy="298" r="14"/><circle cx="215" cy="312" r="15"/><circle cx="80" cy="292" r="12"/>
  </g>

  <!-- action sparks -->
  <g stroke="#f2a900" stroke-width="5" stroke-linecap="round">
    <path d="M362 60 l18 -16"/><path d="M372 92 l26 -2"/><path d="M350 36 l4 -24"/>
    <path d="M44 128 l-22 -10"/><path d="M40 160 l-26 4"/>
  </g>
  <path d="M330 248 l10 -26 l6 18 l20 -10 l-10 22 z" fill="#ff5d5d"/>

  <!-- envelope (the opponent) -->
  <g transform="rotate(14 250 200)" filter="url(#shadow)">
    <rect x="160" y="140" width="190" height="125" rx="12" fill="url(#paper)" stroke="#1f5fa8" stroke-width="6"/>
    <path d="M166 148 L255 213 L344 148" fill="none" stroke="#1f5fa8" stroke-width="6" stroke-linejoin="round"/>
    <path d="M166 258 L228 200 M344 258 L282 200" fill="none" stroke="#1f5fa8" stroke-width="4" opacity="0.5"/>
    <!-- worried face -->
    <g transform="translate(300 232)">
      <circle cx="-14" cy="0" r="5" fill="#0b2545"/><circle cx="10" cy="-2" r="5" fill="#0b2545"/>
      <path d="M-22 -12 l10 4 M18 -14 l-10 5" stroke="#0b2545" stroke-width="3" stroke-linecap="round"/>
      <path d="M-14 16 q6 -6 12 0 t12 0" fill="none" stroke="#0b2545" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- stamp -->
    <rect x="312" y="152" width="26" height="30" rx="3" fill="#ffd166" stroke="#1f5fa8" stroke-width="2"/>
    <text x="325" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f5fa8" text-anchor="middle">@</text>
  </g>

  <!-- paperclip (the hero) -->
  <g transform="translate(92 34) rotate(-16 60 140)">
    <path d="M44 92 V222 A17 17 0 0 0 78 222 V52 A30 30 0 0 0 18 52 V244 A42 42 0 0 0 102 244 V120"
          fill="none" stroke="#3b4652" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 92 V222 A17 17 0 0 0 78 222 V52 A30 30 0 0 0 18 52 V244 A42 42 0 0 0 102 244 V120"
          fill="none" stroke="url(#steel)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- eyes -->
    <g>
      <ellipse cx="34" cy="74" rx="17" ry="20" fill="#ffffff" stroke="#3b4652" stroke-width="3"/>
      <ellipse cx="72" cy="74" rx="17" ry="20" fill="#ffffff" stroke="#3b4652" stroke-width="3"/>
      <circle cx="42" cy="80" r="7.5" fill="#0b2545"/><circle cx="80" cy="80" r="7.5" fill="#0b2545"/>
      <circle cx="44.5" cy="77" r="2.3" fill="#ffffff"/><circle cx="82.5" cy="77" r="2.3" fill="#ffffff"/>
      <!-- determined brows -->
      <path d="M16 50 L48 60" stroke="#0b2545" stroke-width="7" stroke-linecap="round"/>
      <path d="M90 48 L60 59" stroke="#0b2545" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- the headlock: a wire arm wrapping over the envelope -->
  <path d="M196 150 C 250 110, 330 130, 352 176 C 366 206, 340 222, 318 206"
        fill="none" stroke="#3b4652" stroke-width="15" stroke-linecap="round"/>
  <path d="M196 150 C 250 110, 330 130, 352 176 C 366 206, 340 222, 318 206"
        fill="none" stroke="url(#steel)" stroke-width="10" stroke-linecap="round"/>
</svg>
