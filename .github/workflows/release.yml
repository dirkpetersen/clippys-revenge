name: Release

# Publishes GitHub release v<Version> (from Directory.Build.props) with the
# single-file ClippysRevenge.exe whenever main has a version that has no tag yet.
# To ship a new version: bump <Version> in Directory.Build.props and merge to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for existing tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! compgen -G "*.sln" >/dev/null && ! compgen -G "*.slnx" >/dev/null; then
            echo "::notice::No solution file yet; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          [ -n "$version" ] || { echo "::error::No <Version> in Directory.Build.props"; exit 1; }
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already released; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Test (no live Outlook)
        if: steps.ver.outputs.skip == 'false'
        run: dotnet test -c Release --filter "live!=outlook&live!=claude"

      - name: Publish single-file exe
        if: steps.ver.outputs.skip == 'false'
        run: |
          dotnet publish src/ClippysRevenge.App -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} -o publish
          mkdir dist
          cp publish/ClippysRevenge.exe dist/
          [ -f install.ps1 ] && cp install.ps1 dist/ || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Create GitHub release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Clippy's Revenge ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            $([[ "${{ steps.ver.outputs.version }}" == *-* ]] && echo --prerelease || echo --latest)

  # Retention: keep the newest 3 releases. If all 3 are younger than 3 days, also keep
  # the newest release that is at least 3 days old; if there is none, delete nothing.
  # Every other release is deleted together with its tag. Runs after every release job.
  prune:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | [.tag_name, (.published_at // .created_at)] | @tsv' > releases.tsv
          python3 - <<'EOF' > delete.txt
          import datetime as dt
          rows = [l.rstrip("\n").split("\t") for l in open("releases.tsv") if l.strip()]
          parse = lambda s: dt.datetime.fromisoformat(s.replace("Z", "+00:00"))
          rows = sorted(((t, parse(d)) for t, d in rows), key=lambda r: r[1], reverse=True)
          now = dt.datetime.now(dt.timezone.utc)
          old = lambda r: now - r[1] >= dt.timedelta(days=3)
          keep = rows[:3]
          if not any(old(r) for r in keep):
              keep += [r for r in rows[3:] if old(r)][:1]
          if not any(old(r) for r in keep):
              keep = rows  # no release is 3 days old yet: delete nothing
          kept = {t for t, _ in keep}
          for t, d in rows:
              print(("KEEP " if t in kept else "DELETE ") + t + " " + d.isoformat())
          EOF
          cat delete.txt
          grep '^DELETE ' delete.txt | cut -d' ' -f2 | while read -r tag; do
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
            echo "Deleted release and tag $tag"
          done
